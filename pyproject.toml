[build-system]
# The minimum is a guarantee, not a placeholder: `license` is a PEP 639 SPDX expression and
# `license-files` lives in `[project]`, which setuptools only understands from 77.0.1 (the
# first published version of that series). 76.1.0 and everything below reject the metadata
# with "project.license must be valid exactly by one definition"; 68.0.0 is the value this
# file used to declare. Verified by building with exactly this version
# (KUYEN_RELEASE_CANDIDATE_05, B5).
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuyen"
dynamic = ["version"]
description = "KUYEN: governed canonical memory and knowledge for Leftraru agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "KUYEN maintainers"}]
keywords = ["knowledge-graph", "canonical-memory", "provenance", "versioning", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.0", "PyYAML>=6.0"]

[project.optional-dependencies]
# `httpx` is not part of the base install: it belongs to the OpenViking adapter, which the
# suite imports at module level (tests/unit/test_adapter.py, test_013_ingestion.py). Without
# it here `pip install -e ".[dev]"` produces an environment where pytest cannot even collect
# the suite (KUYEN_RELEASE_CANDIDATE_05, M7). `pytest-cov` is what the documented coverage
# command needs.
openviking = ["httpx>=0.25"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=5.0", "httpx>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kuyen*"]

# Contract schemas, the ontology profiles and the versioned Skill are runtime
# assets of the installed package, not loose files of a source checkout.
[tool.setuptools.package-data]
kuyen = [
  "schemas/*.json",
  "config/ontologies/*.yaml",
  "config/ontologies/profiles/*.yaml",
  "skills/knowledge-graph/*",
  "py.typed",
]

# Single source of truth for the version: the VERSION file at the project root.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "openviking: needs a running OpenViking instance; excluded from the default run",
  "installed: only meaningful against an installed wheel or sdist",
]

[tool.coverage.run]
source = ["kuyen"]
